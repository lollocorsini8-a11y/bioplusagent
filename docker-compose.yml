services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biopulse}
      POSTGRES_DB: ${POSTGRES_DB:-biopulse}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biopulse}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biopulse}:${POSTGRES_PASSWORD:-biopulse}@db:5432/${POSTGRES_DB:-biopulse}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      AUTH_DISABLED: "false"
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BIOMETRIC_RETENTION_DAYS: ${BIOMETRIC_RETENTION_DAYS:-365}
      CLINICAL_RETENTION_DAYS: ${CLINICAL_RETENTION_DAYS:-730}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_SAME_ORIGIN: ${NEXT_PUBLIC_API_SAME_ORIGIN:-false}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
